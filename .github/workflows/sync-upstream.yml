name: Sync Fork with Upstream

on:
  schedule:
    # Runs every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    # Run only in the fork, not in the original repository.
    if: github.repository == 'SriGanesh-123/Reverse_Engeneering_Anything'
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream changes
        run: |
          git remote add upstream https://github.com/morluto/rea.git
          git fetch upstream main

      - name: Merge upstream into fork
        run: git merge --no-edit upstream/main

      - name: Push updated fork
        run: git push origin HEAD:main
